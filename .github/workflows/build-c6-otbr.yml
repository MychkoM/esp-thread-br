```yaml
name: Build ESP32-C6 Native Thread Border Router

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: ESP32-C6 Native OTBR
    runs-on: ubuntu-24.04

    container:
      image: espressif/idf:v5.5.4

    env:
      PROJECT_DIR: ${{ github.workspace }}/ot_br

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git
        run: |
          set -euxo pipefail
          git config --global --add safe.directory '*'

      - name: Verify ESP-IDF
        run: |
          set -euxo pipefail

          . /opt/esp/idf/export.sh

          echo "IDF_PATH=$IDF_PATH"
          idf.py --version
          python --version

      # ---------------------------------------------------------
      # Use the official ESP-IDF ot_br example.
      # Do NOT build esp-thread-br/examples/basic_thread_border_router.
      # ---------------------------------------------------------
      - name: Copy official ESP-IDF ot_br example
        run: |
          set -euxo pipefail

          rm -rf "$PROJECT_DIR"

          cp -a \
            /opt/esp/idf/examples/openthread/ot_br \
            "$PROJECT_DIR"

      # ---------------------------------------------------------
      # ESP32-C6
      # ---------------------------------------------------------
      - name: Set ESP32-C6 target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          . /opt/esp/idf/export.sh

          idf.py set-target esp32c6

      # ---------------------------------------------------------
      # Native 802.15.4 radio
      # ---------------------------------------------------------
      - name: Configure native C6 radio
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          cat >> sdkconfig.defaults <<'EOF'

          #
          # ESP32-C6 single-chip Border Router
          #

          CONFIG_IDF_TARGET="esp32c6"

          # Native IEEE 802.15.4 radio
          CONFIG_OPENTHREAD_RADIO_NATIVE=y
          CONFIG_OPENTHREAD_RADIO_SPINEL_UART=n

          # OpenThread Border Router
          CONFIG_OPENTHREAD_ENABLED=y
          CONFIG_OPENTHREAD_BORDER_ROUTER=y
          CONFIG_OPENTHREAD_FTD=y

          # Wi-Fi + Thread coexistence
          CONFIG_ESP_COEX_SW_COEXIST_ENABLE=y

          # IPv6
          CONFIG_LWIP_IPV6_FORWARD=y
          CONFIG_LWIP_IPV6_NUM_ADDRESSES=12
          CONFIG_LWIP_MULTICAST_PING=y
          CONFIG_LWIP_NETIF_STATUS_CALLBACK=y
          CONFIG_LWIP_HOOK_IP6_ROUTE_DEFAULT=y
          CONFIG_LWIP_HOOK_ND6_GET_GW_DEFAULT=y
          CONFIG_LWIP_HOOK_IP6_INPUT_CUSTOM=y
          CONFIG_LWIP_HOOK_IP6_SELECT_SRC_ADDR_CUSTOM=y

          # USB Serial/JTAG console
          CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
          CONFIG_ESP_CONSOLE_SECONDARY_NONE=y

          # CLI
          CONFIG_OPENTHREAD_CLI=y
          CONFIG_OPENTHREAD_CLI_ESP_EXTENSION=y
          EOF

      # ---------------------------------------------------------
      # Check final configuration
      # ---------------------------------------------------------
      - name: Reconfigure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          . /opt/esp/idf/export.sh

          idf.py reconfigure

      - name: Show important configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          echo "===== TARGET ====="
          grep '^CONFIG_IDF_TARGET' sdkconfig || true

          echo
          echo "===== OPENTHREAD RADIO ====="
          grep '^CONFIG_OPENTHREAD_RADIO_' sdkconfig || true

          echo
          echo "===== BORDER ROUTER ====="
          grep '^CONFIG_OPENTHREAD_BORDER_ROUTER' sdkconfig || true

          echo
          echo "===== COEX ====="
          grep '^CONFIG_ESP_COEX_' sdkconfig || true

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Build firmware
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          . /opt/esp/idf/export.sh

          idf.py build 2>&1 | tee build.log

      # ---------------------------------------------------------
      # Merge
      # ---------------------------------------------------------
      - name: Merge binaries
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          . /opt/esp/idf/export.sh

          esptool.py \
            --chip esp32c6 \
            merge_bin \
            -o build/esp32c6-native-otbr-merged.bin \
            @build/flash_args

      # ---------------------------------------------------------
      # Verify
      # ---------------------------------------------------------
      - name: Verify binaries
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail

          test -f build/esp_ot_br.bin || \
            test -f build/ot_br.bin

          test -f build/bootloader/bootloader.bin
          test -f build/partition_table/partition-table.bin
          test -f build/esp32c6-native-otbr-merged.bin

          echo
          echo "===== BINARIES ====="
          find build -type f -name '*.bin' -exec ls -lh {} \;

      # ---------------------------------------------------------
      # Upload firmware
      # ---------------------------------------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-native-otbr
          if-no-files-found: error
          retention-days: 30
          path: |
            ot_br/build/esp32c6-native-otbr-merged.bin
            ot_br/build/*.bin
            ot_br/build/bootloader/*.bin
            ot_br/build/partition_table/*.bin
            ot_br/build/flash_args

      # ---------------------------------------------------------
      # Upload log even if build fails
      # ---------------------------------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-native-otbr-build-log
          if-no-files-found: warn
          retention-days: 14
          path: |
            ot_br/build.log
            ot_br/sdkconfig
```
