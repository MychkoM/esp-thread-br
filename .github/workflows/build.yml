name: Build ESP32-C6 Thread Border Router

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware for Super Mini ESP32-C6
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix Git Permissions & IDF Component Manifests
        run: |
          # 1. Исправление прав доступа Git в Docker
          git config --global --add safe.directory '*'

          # 2. Удаление файлов idf_component.yml из встроенных примеров ESP-IDF
          find /opt/esp/idf/examples -name "idf_component.yml" -delete

          # 3. Гарантированное удаление строк override_path через Python
          python3 -c "
          import os, re
          for search_dir in ['/opt/esp/idf', '.']:
              for root, _, files in os.walk(search_dir):
                  for f in files:
                      if f == 'idf_component.yml':
                          p = os.path.join(root, f)
                          with open(p, 'r') as fp:
                              txt = fp.read()
                          if 'override_path' in txt:
                              txt = re.sub(r'.*override_path:.*?\n', '', txt)
                              with open(p, 'w') as fp:
                                  fp.write(txt)
          "

      - name: Configure Super Mini ESP32-C6 Settings
        run: |
          cd examples/basic_thread_border_router

          # Создаем кастомную таблицу разделов под 4MB Flash
          cat << 'EOF' > partitions.csv
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x6000,
          otdata,   data, ota,     0xf000,  0x2000,
          phy_init, data, phy,     0x11000, 0x1000,
          factory,  app,  factory, 0x20000, 0x280000,
          EOF

          # Настройка USB CDC, REST API и Wi-Fi
          cat << 'EOF' > sdkconfig.defaults.esp32c6
          CONFIG_IDF_TARGET="esp32c6"

          # Native USB CDC для платы Super Mini (GPIO18/19)
          CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
          CONFIG_ESP_CONSOLE_SECONDARY_NONE=y

          # OpenThread Border Router + REST API (порт 8081)
          CONFIG_OPENTHREAD_BORDER_ROUTER=y
          CONFIG_OPENTHREAD_REST_SERVER=y
          CONFIG_OPENTHREAD_REST_SERVER_PORT=8081
          CONFIG_OPENTHREAD_SRP_SERVER=y

          # Настройки разделов
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"

          # Учетные данные Wi-Fi
          CONFIG_EXAMPLE_WIFI_SSID="${{ secrets.WIFI_SSID || 'YOUR_WIFI_SSID' }}"
          CONFIG_EXAMPLE_WIFI_PASSWORD="${{ secrets.WIFI_PASSWORD || 'YOUR_WIFI_PASSWORD' }}"
          EOF

      - name: Build Firmware
        run: |
          . /opt/esp/idf/export.sh
          cd examples/basic_thread_border_router
          idf.py set-target esp32c6
          idf.py build

      - name: Merge Binaries into Single Artifact
        run: |
          . /opt/esp/idf/export.sh
          cd examples/basic_thread_border_router/build
          esptool.py --chip esp32c6 merge_bin -o esp32c6_otbr_merged_0x0.bin @flash_args

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: super-mini-esp32c6-otbr
          path: |
            examples/basic_thread_border_router/build/esp32c6_otbr_merged_0x0.bin
            examples/basic_thread_border_router/build/basic_thread_border_router.bin
            examples/basic_thread_border_router/build/bootloader/bootloader.bin
            examples/basic_thread_border_router/build/partition_table/partition-table.bin
